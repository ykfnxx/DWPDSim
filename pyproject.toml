[build-system]
requires = [
  "scikit-build-core>=0.11",
  "pybind11>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "dwpdsim"
version = "0.4.0"
description = "A policy-driven block simulator for DRAM and peer SLC/TLC SSD media."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "DWPDSim contributors" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "numpy>=2",
  "pybind11>=3.0",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.scikit-build]
wheel.packages = ["src/dwpdsim"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
