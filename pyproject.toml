[build-system]
requires = [
  "scikit-build-core>=0.11",
  "pybind11>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "dwpdsim"
version = "1.0.0"
description = "A policy-driven block simulator for DRAM and SLC/TLC storage tiers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "DWPDSim contributors" },
]
dependencies = [
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
input = ["numpy>=2", "pyarrow>=18"]
hub = ["numpy>=2", "pyarrow>=18", "datasets>=3"]
dev = [
  "numpy>=2",
  "pybind11>=3.0",
  "pytest>=8",
  "ruff>=0.6",
]

[dependency-groups]
# Reuse the published extras for local development and Parquet input tests.
dev = ["dwpdsim[dev,input]"]

[tool.uv]
# Native source edits must invalidate the editable extension build.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "cpp/**/*.cpp" },
  { file = "cpp/**/*.hpp" },
]

[tool.scikit-build]
wheel.packages = ["src/dwpdsim"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
