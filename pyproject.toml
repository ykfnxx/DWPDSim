[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dwpdsim"
version = "0.2.0"
description = "A policy-driven block simulator for DRAM and peer SLC/TLC SSD media."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "DWPDSim contributors" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dwpdsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
